resources:
  pipelines:
    incident_ingest:
      name: incident_ingest
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      channel: CURRENT
      # Bronze plus the normalized Silver snapshot views. SCD2 history is built by a separate pipeline
      # (see docs/week2-silver-design.md), because its snapshot function reads these views.
      libraries:
        - file:
            path: ../src/pipelines/bronze.py
        - file:
            path: ../src/pipelines/silver.py
      configuration:
        landing_root: /Volumes/${var.catalog}/bronze/landing
