resources:
  pipelines:
    incident_history:
      name: incident_history
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      channel: CURRENT
      # SCD2 from the snapshot views built by incident_ingest. Run after it, via the incident_refresh job.
      libraries:
        - file:
            path: ../src/pipelines/history.py
      configuration:
        cer_snapshot_table: ${var.catalog}.silver.cer_incident_snapshot
